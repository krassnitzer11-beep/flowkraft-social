<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>flowkraft Motion Engine</title>
<style>
@font-face{font-family:'Aesthetic Romance';src:url(assets/AestheticRomance.ttf) format('truetype');font-weight:400;font-style:normal;font-display:block}
@font-face{font-family:'Open Sans Condensed';src:url(assets/OpenSansCondensed-Regular.woff2) format('woff2');font-weight:400;font-style:normal;font-display:block}
@font-face{font-family:'Open Sans Condensed';src:url(assets/OpenSansCondensed-Bold.woff2) format('woff2');font-weight:700;font-style:normal;font-display:block}
html,body{margin:0;background:#07121e}
body{width:1080px;height:1350px;overflow:hidden}
#comp{position:absolute;left:0;top:0;width:1080px;height:1350px}
.stage{width:1080px;height:1350px;position:relative;overflow:hidden;background:#17324d;font-family:'Open Sans Condensed','Arial Narrow',sans-serif}
.bg{position:absolute;left:-90px;top:-110px;width:1260px;height:1570px;background:#17324d url(assets/aurora-navy.jpg) center/cover no-repeat}
.fx{position:absolute;inset:0;pointer-events:none;overflow:visible}
.mark{position:absolute;left:636px;top:650px;height:820px;width:624px;opacity:.1;transform-origin:50% 50%}
.sweep{position:absolute;top:-200px;left:0;width:520px;height:1750px;background:linear-gradient(90deg,rgba(234,240,245,0) 0%,rgba(234,240,245,.16) 45%,rgba(234,240,245,.24) 50%,rgba(234,240,245,.16) 55%,rgba(234,240,245,0) 100%);mix-blend-mode:soft-light;opacity:0}
.ring{position:absolute;border:3px solid #4A9BD8;border-radius:50%;opacity:0;transform:translate(-50%,-50%);box-shadow:0 0 30px rgba(40,120,181,.5)}
.slide{position:absolute;inset:0;box-sizing:border-box;padding:80px 88px 72px;color:var(--ink);display:flex;flex-direction:column;justify-content:space-between}
.wm{display:inline-block;clip-path:inset(-25% -12% -22% -12%)}
.w,.pw,.sw{display:inline-block}
.script{font-family:'Aesthetic Romance',Georgia,serif;font-weight:400;letter-spacing:0;color:var(--script)}
.ol{color:transparent;-webkit-text-stroke:3px var(--ink);background-image:linear-gradient(90deg,var(--ink) 0 50%,transparent 50% 100%);background-size:200% 100%;background-position:100% 0;-webkit-background-clip:text;background-clip:text;padding:0 .04em;margin:0 -.04em}
.num{font-size:200px;line-height:.9;font-weight:700;opacity:.7;align-self:flex-start;display:inline-flex}
.col{position:relative;display:inline-block;height:180px;clip-path:inset(-6px -60px -6px -60px)}
.col .ghost{visibility:hidden}
.col .strip{position:absolute;left:0;top:0;display:flex;flex-direction:column}
.col .strip span{display:block;height:180px;-webkit-text-stroke:3px var(--ink)}
.arrow{display:inline-block}
.btn{background:var(--btnbg);color:var(--btnfg);font-size:34px;font-weight:700;padding:18px 32px;position:relative;overflow:hidden;display:inline-block}
.btn .shine{position:absolute;top:-20px;bottom:-20px;width:90px;left:0;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(96,198,195,.6),rgba(255,255,255,0));transform:translateX(-200px) skewX(-18deg)}
.ball{position:absolute;left:0;top:0;width:132px;height:132px;opacity:0}
.ball-in{width:100%;height:100%;border-radius:50%;background:#17324d;box-shadow:0 18px 40px rgba(7,18,30,.45),inset 0 0 0 2px rgba(234,240,245,.18);display:flex;align-items:center;justify-content:center}
.ball-in img{height:58%;width:auto;margin-left:4%}
/* 3D */
.scene{position:absolute;left:0;top:0;width:1080px;height:1350px;perspective:1800px;pointer-events:none}
.g3d{position:absolute;inset:0;transform-style:preserve-3d}
.slab{position:absolute;transform-style:preserve-3d}
.slab>.ly,.slab>.face{position:absolute;inset:0;box-sizing:border-box}
.face{display:flex;align-items:center;justify-content:center}
.ico{fill:none;stroke:#eaf0f5;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.badge{position:absolute;display:flex;align-items:center;justify-content:center;border-radius:50%;background:#eaf0f5;color:#17324d;font-weight:700;box-shadow:0 10px 24px rgba(7,18,30,.4)}
.pill{position:absolute;width:150px;height:58px;border-radius:18px;background:#eaf0f5;box-sizing:border-box;padding:14px 16px;display:flex;flex-direction:column;gap:9px;box-shadow:0 10px 20px rgba(7,18,30,.3)}
.pill i{display:block;height:8px;border-radius:4px;background:#2878b5}
.pill i+i{width:62%;background:#9CCBF0}
.lab{position:absolute;font-size:24px;letter-spacing:.14em;text-transform:uppercase;color:#eaf0f5;white-space:nowrap;transform:translateX(-50%)}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="bg" id="bg"></div>
  <div id="comp">
  <svg class="fx" width="1080" height="1350" viewBox="0 0 1080 1350" aria-hidden="true">
    <defs>
      <radialGradient id="dg"><stop offset="0" stop-color="#eaf0f5"/><stop offset=".35" stop-color="#9CCBF0"/><stop offset="1" stop-color="#9CCBF0" stop-opacity="0"/></radialGradient>
      <linearGradient id="fk" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#2878B5"/><stop offset="1" stop-color="#9CCBF0"/></linearGradient>
    </defs>
    <g id="dots"></g>
  </svg>
  <img class="mark" id="mark" src="assets/bildmarke.svg" alt="" aria-hidden="true">
  <div id="hero" class="fx"></div>
  <div class="fx" id="accent"></div>
  <div class="slide" id="slide"></div>
  <div class="sweep" id="sweep"></div>
  </div>
  <div id="fog" style="position:absolute;inset:0;pointer-events:none;overflow:hidden"></div>
  <div id="veil" style="position:absolute;inset:0;pointer-events:none;opacity:0"></div>
</div>
<script>document.write('<script src="' + new URLSearchParams(location.search).get('post') + '"><\/script>');</script>
<script>
// ================= CONFIG: Texte 1:1 aus der Vorlage, Aufbau pro Slide verschieden =================
let T = 9; const FPS = 30;
const params = new URLSearchParams(location.search);
const POST = window.POST;
const V = params.get('v') || POST.theme || 'navy';
const FMT = params.get('f') || 'carousel';            // carousel 1080x1350 | story 1080x1920 | reel 1080x1920
const TALL = FMT !== 'carousel', STORY = FMT === 'story', REEL = FMT === 'reel';
const CLEAN = !!POST.clean;
const LAYER = params.get('layer') === 'hero', PARTF = params.get('part');   // part=h: nur Szene, part=t: nur Schrift   // nur Szene + Ball, transparent, ohne Headline (für den 3D-Flug)
const FLIGHT = REEL && !!POST.flight;   // Reel-Variante Drohnenflug: Kamera fliegt durch Nebel in die Tiefe statt Ball-Abdeckung
const RO = 0;   // früher Reel-Verschiebung; Reel hat jetzt weder Kopf noch Fuß   // Standbild-Post: ohne Logo, Label, flowkraft.at
const TH = {
  navy: {ink:'#eaf0f5', inkRGB:'234,240,245', muted:'#d1e0ec', script:'#eaf0f5', logo:'assets/logo-hell.svg', stage:'#17324d', bg:'assets/aurora-navy.jpg', bgO:1, mark:true, btnbg:'#eaf0f5', btnfg:'#17324d'},
  dark: {ink:'#eaf0f5', inkRGB:'234,240,245', muted:'#d1e0ec', script:'#2878b5', logo:'assets/logo-hell.svg', stage:'#07121e', bg:'assets/bg-nacht.png', bgO:1, mark:true, btnbg:'#eaf0f5', btnfg:'#17324d'},
  mist: {ink:'#17324d', inkRGB:'23,50,77', muted:'#656263', script:'#2878b5', logo:'assets/logo-dunkel.svg', stage:'#ffffff', bg:'assets/bg-mist.jpg', bgO:.4, mark:false, btnbg:'#17324d', btnfg:'#eaf0f5'},
}[V];
TH.label = POST.label ?? '';
if (POST.script) TH.script = POST.script;
const FMARK = V === 'mist' ? 'assets/bildmarke-dunkel.svg' : 'assets/bildmarke.svg';
const stageEl = document.getElementById('stage'), comp = document.getElementById('comp');
{ const b = document.getElementById('bg'), story = TALL;
  window.SIZE = {w: 1080, h: story ? 1920 : 1350};
  document.body.style.height = stageEl.style.height = window.SIZE.h + 'px';
  comp.style.top = story ? '285px' : '0';             // Instagram-Sicherheitszonen oben/unten
  if (story) b.style.height = '2140px';
  const set = {'--ink':TH.ink, '--script':TH.script, '--btnbg':TH.btnbg, '--btnfg':TH.btnfg, '--hink':TH.ink, '--hrgb':TH.inkRGB,
    '--hsub': V === 'mist' ? '#5b7088' : '#8C9DB0', '--htile': V === 'mist' ? '#f3f7fa' : 'rgba(9,19,31,.8)'};
  for (const k in set) stageEl.style.setProperty(k, set[k]);
  stageEl.style.background = TH.stage; b.style.background = `${V === 'mist' ? '#fff' : TH.stage} url(${TH.bg}) center/cover no-repeat`; b.style.opacity = TH.bgO;
  if (!TH.mark) document.getElementById('mark').style.display = 'none';
  if (STORY || REEL) document.getElementById('mark').style.top = '980px';   // Story: Wasserzeichen tiefer, unten angeschnitten
  if (V === 'mist') document.querySelectorAll('#dg stop').forEach(x => x.setAttribute('stop-color', '#2878B5')); }
const NS = 'http://www.w3.org/2000/svg';
const I = {
  mail:'<path d="M22 7l-9 5.7c-.6.4-1.4.4-2 0L2 7"/><rect x="2" y="4" width="20" height="16" rx="2"/>',
  chat:'<path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/>',
  crm:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
  bot:'<path d="M12 8V4H8"/><rect x="4" y="8" width="16" height="12" rx="2"/><path d="M2 14h2M20 14h2M15 13v2M9 13v2"/>',
  calc:'<rect x="4" y="2" width="16" height="20" rx="2"/><path d="M8 6h8M16 14v4M8 10h.01M12 10h.01M16 10h.01M8 14h.01M12 14h.01M8 18h.01M12 18h.01"/>',
  invoice:'<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4M10 9H8M16 13H8M16 17H8"/>',
  user:'<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
  send:'<path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/>',
  check:'<path d="M20 6 9 17l-5-5"/>',
  clock:'<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
  calendar:'<path d="M8 2v4M16 2v4"/><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M3 10h18"/>',
  phone:'<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2Z"/>',
  search:'<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
  file:'<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/>',
  folder:'<path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.7-.9l-.8-1.2A2 2 0 0 0 7.9 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/>',
  zap:'<path d="M13 2 4 14h7l-1 8 9-12h-7l1-8z"/>',
  database:'<ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14a9 3 0 0 0 18 0V5"/><path d="M3 12a9 3 0 0 0 18 0"/>',
  chart:'<path d="M3 3v18h18"/><path d="M8 17V10M13 17V6M18 17v-4"/>',
  euro:'<path d="M4 10h12M4 14h9"/><path d="M19 6a7.7 7.7 0 0 0-5.2-2A7.9 7.9 0 0 0 6 12c0 4.4 3.5 8 7.8 8 2 0 3.8-.8 5.2-2"/>',
  globe:'<circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20"/>',
  shield:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/>',
  wrench:'<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.8-3.8a6 6 0 0 1-7.9 7.9l-6.9 6.9a2.1 2.1 0 0 1-3-3l6.9-6.9a6 6 0 0 1 7.9-7.9Z"/>',
  home:'<path d="m3 10 9-7 9 7v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1Z"/><path d="M9 22v-9h6v9"/>',
};
// Icon: Name aus I oder eigener SVG-Inhalt (beginnt mit <)
const icon = (n, size, color='#eaf0f5', sw=1.6) => `<svg viewBox="0 0 24 24" width="${size}" height="${size}" class="ico" style="stroke:${color};stroke-width:${sw}">${n[0] === '<' ? n : (I[n] ?? I.check)}</svg>`;

const HEADER = `<div style="position:relative;display:flex;justify-content:space-between;align-items:center">
  <img src="${TH.logo}" alt="flowkraft – Automation &amp; Agents" style="height:73px;width:auto">
  <span style="font-size:26px;letter-spacing:.2em;color:${TH.muted};opacity:.7">${TH.label}</span></div>`;
const URL_ = `<span style="font-family:'Aesthetic Romance',Georgia,serif;font-size:44px;color:var(--ink);opacity:.7">flowkraft.at</span>`;
const pager = (n, st='') => `<div style="position:relative;display:flex;justify-content:space-between;align-items:center;${st}">
  <span style="font-size:30px;letter-spacing:.2em;color:var(--ink);opacity:.7">${n} / 6 &nbsp;<span class="arrow" data-arrow>→</span></span>${URL_}</div>`;
const P = (txt, st='') => `<p data-p style="position:relative;margin:0;font-size:40px;line-height:1.3;color:var(--ink);max-width:860px;${st}">${
  txt.split(' ').map(w => `<span class="pw" data-a="p">${w}</span>`).join(' ')}</p>`;
const W = (txt, outline=false) => txt.split(' ').map(w => `<span class="wm"><span class="w${outline?' ol':''}" data-a="w"${outline?' data-ol':''}>${w}</span></span>`).join(' ');
const SCR = (size, word) => `<span class="sw script" data-a="s" style="font-size:${size}px">${word}</span>`;
const H1 = (size, inner, st='') => `<h1 style="margin:0;font-size:${size}px;line-height:.98;font-weight:700;letter-spacing:-1px;color:var(--ink);position:relative;${st}">${inner}</h1>`;
const NUM = (n, st='') => `<span class="num" data-a="num" style="${st}">${[...n].map((d, i) => {
  const seq = []; for (let k = 0; k < 5 + i*2; k++) seq.push((+d + 3 + k*7) % 10); seq.push(d);
  return `<span class="col"><span class="ghost">${d}</span><span class="strip">${seq.map(x => `<span>${x}</span>`).join('')}</span></span>`; }).join('')}</span>`;
const BOX = (inner, st='') => `<div style="position:relative;display:flex;flex-direction:column;gap:40px;${st}">${inner}</div>`;

// ================= Easing =================
const clamp = (x,a=0,b=1) => Math.min(b, Math.max(a, x));
const prog = (t, s, d) => clamp((t - s) / d);
const backOut = (x, s=1.6) => x <= 0 ? 0 : x >= 1 ? 1 : 1 + (s+1)*Math.pow(x-1,3) + s*Math.pow(x-1,2);
const cubicOut = x => 1 - Math.pow(1-x, 3);
const cubicIn = x => x*x*x;
const inOut = x => x < .5 ? 4*x*x*x : 1 - Math.pow(-2*x+2, 3)/2;
const lerp = (a, b, x) => a + (b - a) * x;
const TAU = Math.PI * 2;
const bump = (t, s, d) => Math.sin(Math.PI * prog(t, s, d));
const el = (tag, css, html='', parent) => { const e = document.createElement(tag); e.style.cssText = css; e.innerHTML = html; if (parent) parent.appendChild(e); return e; };
const vis = (e, on) => e.style.visibility = on ? 'visible' : 'hidden';

// Extrudierter Körper: Lagen + Vorderseite = echte Tiefe im 3D-Raum
function slab(parent, {x, y, w, h, r='24%', depth=40, face, side='#0e2236', html=''}) {
  const root = el('div', `left:${x}px;top:${y}px;width:${w}px;height:${h}px`, '', parent); root.className = 'slab';
  for (let z = depth; z > 0; z -= 3) { const l = el('div', `border-radius:${r};background:${side};transform:translateZ(${-z}px)`, '', root); l.className = 'ly'; }
  const f = el('div', `border-radius:${r};background:${face}`, html, root); f.className = 'face';
  return {root, face: f};
}
function scene(rot) {
  const hero = document.getElementById('hero');
  const s = el('div', '', '', hero); s.className = 'scene';
  const g = el('div', `transform:${rot}`, '', s); g.className = 'g3d';
  return g;
}
const GRAD = 'linear-gradient(120deg,#2878B5,#3F8FCD)';
const HUB = 'radial-gradient(120% 120% at 30% 20%,#173552,#0A1826)';
const FACE = V === 'mist' ? 'linear-gradient(160deg,#ffffff,#f3f7fa)' : HUB, SIDE = V === 'mist' ? '#c6d6e3' : '#071320';
const HINK = V === 'mist' ? '#17324d' : '#eaf0f5', HSUB = V === 'mist' ? '#5b7088' : '#8C9DB0';
const hubStyle = f => { f.style.border = V === 'mist' ? '2px solid rgba(23,50,77,.1)' : '2px solid rgba(74,155,216,.35)'; f.style.boxShadow = V === 'mist' ? '0 30px 70px -22px rgba(23,50,77,.38)' : '0 0 90px -14px rgba(40,120,181,.75)'; };
const lift = (t, s, d=.55, k=2) => backOut(prog(t, s, d), k);

// ================= Szenen =================
const HEROES = {
  // ---- 1: Mail + Chat, Nachrichten schießen hoch, dann Ruhe ----
  chaos(P) {
    const org = '50% 1030px', base = a => `rotateX(${4 + .8*Math.sin(a)}deg) rotateY(${-9 + 1.6*Math.sin(a*.7)}deg)`;
    const g = scene(base(0)); g.style.transformOrigin = org;
    const mk = (x, ic, lab) => { const s = slab(g, {x, y: 880, w: 300, h: 300, r: '22%', depth: 54, face: FACE, side: SIDE,
        html: `<div style="display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--hink)"><span style="font-size:136px;font-weight:700;line-height:1">${ic}</span><span style="font-size:32px;letter-spacing:.08em">${lab}</span></div>`}); hubStyle(s.face);
      const b = el('div', 'right:-34px;top:-34px;width:112px;height:112px;font-size:46px;transform:translateZ(40px)', '0', s.root); b.className = 'badge'; return {...s, b}; };
    const A = mk(150, P.a ?? '@', P.aLabel ?? 'E-Mail'), B = mk(540, P.b ?? 'WA', P.bLabel ?? 'WhatsApp');
    const pills = Array.from({length: 26}, (_, i) => { const p = el('div', 'left:0;top:0', '<i></i><i></i>', g); p.className = 'pill';
      return {p, src: i % 2, jx: ((i*73) % 120) - 60, r: ((i*37) % 30) - 15, k: i}; });
    return { anchors: {mail: A.face, chat: B.face},
      seek(t, TM, H0, L) {
        g.style.transform = base(TAU*L);
        const s1 = TM['h:mail'], s2 = TM['h:chat'], col = TM.script;
        [[A, s1], [B, s2]].forEach(([o, s], i) => {
          vis(o.root, t >= s);
          const calm = t > col + .9 ? 10*Math.sin(TAU*L*2 + i*2) : 0;
          o.root.style.transform = `translateY(${calm.toFixed(2)}px) scale(${lift(t, s).toFixed(4)})`;
          const up = Math.pow(prog(t, s + .15, col - s - .35), 1.6), dn = inOut(prog(t, col, .7));
          const c = Math.round(99 * up * (1 - dn)), peak = up >= 1 && dn === 0, done = t >= col + .7;
          o.b.innerHTML = done ? icon('check', 64, '#ffffff', 3) : (peak ? '99+' : c);
          o.b.style.background = done ? '#2878B5' : '#eaf0f5';
          const sh = 1 + .1*Math.sin(t*38)*up*(1 - dn);
          o.b.style.transform = `translateZ(40px) scale(${(lift(t, s + .12, .45, 2.4) * sh * (1 + .35*bump(t, col + .7, .3))).toFixed(4)})`;
        });
        pills.forEach(q => {
          const born = s1 + .2 + q.k * (col - s1 - .1) / pills.length, x = prog(t, born, .95), on = x > 0 && x < 1;
          vis(q.p, on); if (!on) return;
          const o = q.src ? B : A, cx = (q.src ? 540 : 150) + 150 - 75, cy = 880 + 90;
          q.p.style.opacity = (1 - cubicIn(x)).toFixed(3);
          q.p.style.transform = `translate3d(${cx + q.jx*(1 + x)}px, ${cy - 640*cubicOut(x)}px, 70px) rotate(${q.r*x}deg) scale(${.7 + .3*(1 - x)})`;
        });
      },
      events(TM) { const s1 = TM['h:mail'], col = TM.script, e = [{k:'pop', t: s1, x: 300, f: 520}, {k:'pop', t: TM['h:chat'], x: 690, f: 620}];
        for (let i = 0; i < 16; i++) e.push({k:'tick', t: s1 + .3 + (col - s1 - .4) * Math.pow(i/16, .7), x: i%2 ? 690 : 300, f: 1500 + i*90});
        e.push({k:'whoosh', t: col, d: .7, x: 540}, {k:'ding', t: col + .72, x: 540}); return e; } };
  },
  // ---- 2: Taschenrechner, dann drei Bausteine ----
  calculator(P) {
    const base = a => `rotateX(${4 + .8*Math.sin(a)}deg) rotateY(${-9 + 1.6*Math.sin(a*.8)}deg)`;

const pn = (g, x, y, w, h, r='30px', depth=18, html='') => { const s = slab(g, {x, y, w, h, r, depth, face: FACE, side: SIDE, html}); hubStyle(s.face); return s; };
const abs = (p, css, html='') => el('div', 'position:absolute;' + css, html, p);

const popIn = (t, list) => list.forEach(([e, s, k=2, d=.5]) => { vis(e, t >= s); e.style.transform = `scale(${lift(t, s, d, k).toFixed(4)})`; });

Object.assign(HEROES, {

    const o = fog * clamp((4000 - zz) / 1600) * clamp(zz / 260);
    p.el.style.opacity = o.toFixed(3); p.el.style.transform = `translate(${(px - w / 2).toFixed(1)}px, ${(py - w / 2).toFixed(1)}px) scale(${(w / p.sz).toFixed(4)})`; });
}
// ================= Frame = reine Funktion der Zeit =================
function seek(t) {
  t = clamp(t, 0, T);
  const L = t / 10;
  document.getElementById('bg').style.transform = `translate(${38*Math.sin(TAU*L)}px, ${26*Math.cos(TAU*L)}px) scale(${1.04 + .025*Math.sin(TAU*L + 1)})`;
  slide.style.transform = `scale(${1 + .006*Math.sin(TAU*L - 1.2)})`;
  DOTS.forEach(d => { d.el.setAttribute('cx', d.x + d.ax*Math.sin(TAU*L + d.ph)); d.el.setAttribute('cy', d.y + d.ay*Math.cos(TAU*L + d.ph*1.3));
    d.el.setAttribute('r', d.r * 2.2); d.el.setAttribute('opacity', (.1 + .25*(.5+.5*Math.sin(TAU*d.tw*L + d.ph))).toFixed(3)); });

  const mp = bump(t, MERGE.t1 - .2, .7);
  mark.style.opacity = (.1 + .1*mp).toFixed(3);
  mark.style.transform = `translate(${8*Math.sin(TAU*L+.5)}px, ${-10*Math.sin(TAU*L)}px) rotate(${2.5*Math.sin(TAU*L)}deg) scale(${1 + .03*mp})`;

  HERO.seek(t, TM, H0, L);
  if (FLIGHT) camera(t);

  const b = ballState(t);
  if (b) { ball.style.opacity = (b.o ?? 1).toFixed(3);
    ball.style.transform = `translate(${(b.x - BALL_D/2).toFixed(2)}px, ${(b.y - BALL_D/2).toFixed(2)}px) scale(${b.s.toFixed(4)})`;
    ballIn.style.transform = `scale(${b.sx.toFixed(4)}, ${b.sy.toFixed(4)}) rotate(${b.r.toFixed(2)}deg)`;
  } else ball.style.opacity = 0;
  if (LAYER) ball.style.opacity = 0;   // im 3D-Flug fliegt der Ball ausschließlich in 3D
  RINGS.forEach((r, i) => { let o = 0, d = 0, p = STOPS[0];
    // im 3D-Flug (LAYER) kommen die Ringe aus 3D, sonst wären sie am Ebenenrand abgeschnitten
    for (const st of STOPS) { if (LAYER) continue; const x = prog(t, st.t + i*.12, .75); if (x > 0 && x < 1) { o = .6*(1 - x); d = BALL_D + 260*cubicOut(x); p = st; } }
    r.style.left = p.x + 'px'; r.style.top = p.y + 'px'; r.style.width = r.style.height = d + 'px'; r.style.opacity = o.toFixed(3); });

  const hold = t >= H0;
  groups.forEach((g, gi) => g.ws.forEach((w, i) => {
    const st = TM['g' + gi] + 0.04 + i*0.08, x = prog(t, st, .6);
    w.style.transform = `translateY(${(125 * (1 - backOut(x, 1.25))).toFixed(2)}%)`; w.style.opacity = x > 0 ? 1 : 0;
    if (g.ol) { const f = 1 - inOut(prog(t, st + .7 + i*.08, .7)); w.style.backgroundPosition = `${(100 - 100*f).toFixed(2)}% 0`; }
  }));
  if (script) { const x = prog(t, TM.script + .03, .85), e = backOut(x, 1.3);
    let r = 0; if (cta) r = 5*Math.sin(TAU*3*prog(t, H0 + .9, .9))*(1 - prog(t, H0 + .9, .9));
    script.style.opacity = clamp(x*2.2).toFixed(3);
    script.style.transform = `translateY(${(60*(1-e)).toFixed(2)}px) scale(${(.82 + .18*e).toFixed(4)}) rotate(${r.toFixed(2)}deg)`;
    const bl = 16*(1 - cubicOut(x)); script.style.filter = bl > .05 ? `blur(${bl.toFixed(2)}px)` : 'none'; }
  if (num) strips.forEach((st, i) => {
    const k = st.children.length - 1, x = prog(t, TM.num + .03 + i*.12, .9 + i*.15);
    st.style.transform = `translateY(${lerp(180, -k*180, backOut(x, .9)).toFixed(2)}px)`;
    const f = 1 - inOut(prog(t, TM.num + 1.3, .6));
    [...st.children].forEach(c => c.style.color = `rgba(${TH.inkRGB},${f.toFixed(3)})`);
  });
  pws.forEach((w, i) => { const x = prog(t, TM.p + .04 + i*.022, .5);
    w.style.opacity = clamp(x*2.4).toFixed(3); w.style.transform = `translateY(${(30*(1 - backOut(x, 1.5))).toFixed(2)}px)`; });
  if (cta) {
    const x = prog(t, TM.cta + .03, .6);
    let s = .5 + .5*backOut(x, 2.4) - .06*Math.sin(Math.PI*prog(t, TM.cta, .14));
    if (hold) s = 1 - .045*(bump(t, H0 + .5, .28) + bump(t, H0 + 1.3, .28));
    cta.style.transform = `scale(${s.toFixed(4)})`; cta.style.opacity = clamp(x*3).toFixed(3);
    document.getElementById('shine').style.transform = `translateX(${(-200 + 780*inOut(prog(t, H0 + .2, .9))).toFixed(1)}px) skewX(-18deg)`;
  }
  const nudge = 18 * (bump(t, H0 + 1.0, .42) + .7*bump(t, H0 + 1.42, .38)) + (TM.arrow ? 26*bump(t, TM.arrow, .35) : 0);
  arrows.forEach(a => a.style.transform = `translateX(${nudge.toFixed(2)}px)`);
  const sw = document.getElementById('sweep'), sx = prog(t, H0 + .1, 1.5);
  sw.style.opacity = Math.sin(Math.PI * sx).toFixed(3);
  sw.style.transform = `translateX(${(-700 + 2300 * inOut(sx)).toFixed(1)}px) rotate(14deg)`;
}

window.FPS = FPS; window.seek = seek;
window.ready = (async () => {
  await document.fonts.ready;
  await Promise.all([...document.images].map(i => i.decode().catch(() => {})));
  await new Promise(r => { const im = new Image(); im.onload = r; im.onerror = r; im.src = 'assets/aurora-navy.jpg'; });
  measure();
  if (LAYER) {
    document.documentElement.style.background = document.body.style.background = 'transparent'; stageEl.style.background = 'transparent';
    ['bg', 'mark', 'sweep'].forEach(id => { const e = document.getElementById(id); if (e) e.style.display = 'none'; });
    document.querySelector('svg.fx').style.display = 'none';
    const sr = stageEl.getBoundingClientRect();
    const box = e => { const r = e.getBoundingClientRect(), mk = document.createElement('span');   // Marke auf der Grundlinie: exakte Höhe der Schriftlinie
      mk.style.cssText = 'display:inline-block;width:0;height:0;vertical-align:baseline'; e.appendChild(mk); const base = mk.getBoundingClientRect().top - sr.top; mk.remove();
      return {x: r.left - sr.left, y: r.top - sr.top, w: r.width, h: r.height, base, fs: parseFloat(getComputedStyle(e).fontSize)}; };
    const W = [];
    groups.forEach((g, gi) => g.ws.forEach((w, i) => W.push({...box(w), txt: w.textContent, ol: g.ol, t: TM['g' + gi] + .04 + i * .08})));
    if (script) W.push({...box(script), txt: script.textContent, script: true, t: TM.script + .03});
    [...words, script].filter(Boolean).forEach(e => e.style.visibility = 'hidden');
    // Bereiche für das Aufteilen in Szene und Schrift (im Endzustand gemessen)
    seek(T - .05); const U = (els) => { let a = null; els.forEach(e => { const r = e.getBoundingClientRect(); if (r.width < 2 || r.height < 2 || r.width > 1300) return;
        const cs = getComputedStyle(e); if (cs.visibility === 'hidden' || cs.display === 'none') return; const b = [r.left - sr.left, r.top - sr.top, r.right - sr.left, r.bottom - sr.top];
        a = a ? [Math.min(a[0], b[0]), Math.min(a[1], b[1]), Math.max(a[2], b[2]), Math.max(a[3], b[3])] : b; }); return a; };
    const heroBox = U([...document.querySelectorAll('#hero *')]), textBox = (() => { let a = U([...pws, num, ...document.querySelectorAll('[data-chip]')].filter(Boolean));
      W.forEach(w => { const b = [w.x, w.y, w.x + w.w, w.y + w.h]; a = a ? [Math.min(a[0], b[0]), Math.min(a[1], b[1]), Math.max(a[2], b[2]), Math.max(a[3], b[3])] : b; }); return a; })();
    seek(0);
    if (PARTF === 'h') document.getElementById('slide').style.opacity = '0';   // Deckkraft statt visibility: Kinder können sie nicht zurücksetzen
    if (PARTF === 't') document.getElementById('hero').style.opacity = '0';
    window.LAYOUT = {heroBox, textBox, words: W, stops: STOPS.map(s => ({key: s.key, t: s.t, x: s.x, y: s.y + (TALL ? 285 : 0)})), H0, T, comp: TALL ? 285 : 0};
  }
  seek(+(params.get('t') || 0));
  if (params.has('play')) { const t0 = performance.now(); const loop = n => { seek(((n - t0) / 1000) % T); requestAnimationFrame(loop); }; requestAnimationFrame(loop); }
  return true;
})();
</script>
